name: Deploy Backend to Azure App Service

# Chained off Backend CI (ci.yml) instead of its own push trigger: this
# workflow only starts once CI has finished on main, and only builds/deploys
# if CI's conclusion was success. That removes the duplicate test job that
# used to run in parallel with CI on every push.
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: rag-system-backend
  REGISTRY: ghcr.io
  IMAGE_NAME: sreeaditya-dev/rag-backend          # GHCR requires lowercase

jobs:
  # ── Only runs if CI succeeded (workflow_dispatch always runs). If CI
  # failed, this job is skipped entirely — no image is built, nothing is
  # pushed, Azure's App Service keeps running whatever container is already
  # live. CI's own workflow already sends a Telegram alert on failure, so no
  # duplicate notification is needed here for that case. ────────────────────
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy container to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.docker_build.outcome }}" != "success" ]; then
            REASON="Docker image build/push to GHCR failed - check the Dockerfile and registry auth."
          elif [ "${{ steps.deploy.outcome }}" != "success" ]; then
            REASON="Azure deploy step failed - check the publish profile/secret and App Service container settings."
          else
            REASON="Unknown step failed."
          fi

          TEXT=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            "Backend Deploy Failed (CI passed, deploy stage broke)" \
            "Repo: ${{ github.repository }}" \
            "Branch: main" \
            "Commit: ${{ github.event.workflow_run.head_sha || github.sha }}" \
            "Author: ${{ github.actor }}" \
            "Reason: ${REASON}" \
            "Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"

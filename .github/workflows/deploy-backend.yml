name: Deploy Backend to Azure App Service

# Runs on every push to main that touches backend/ — a merged PR into main
# produces exactly this kind of push, so no separate pull_request trigger
# is needed (that would deploy on every PR update, before it's even merged).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: rag-system-backend
  REGISTRY: ghcr.io
  IMAGE_NAME: sreeaditya-dev/rag-backend          # GHCR requires lowercase

jobs:
  # ── Gate: must pass before any image is built, pushed, or deployed ─────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build / import sanity check
        id: build_check
        working-directory: backend
        run: python -c "from app.main import app; print('import OK')"

      - name: Run test suite
        id: pytest
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.install.outcome }}" != "success" ]; then
            REASON="Dependency install failed (requirements.txt) - a package likely broke or is unresolvable."
          elif [ "${{ steps.build_check.outcome }}" != "success" ]; then
            REASON="Build/import check failed - app.main failed to import (syntax error or broken import chain)."
          elif [ "${{ steps.pytest.outcome }}" != "success" ]; then
            REASON="Test suite failed - one or more pytest cases did not pass."
          else
            REASON="Unknown step failed."
          fi

          TEXT=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            "Backend Deploy BLOCKED - tests failed before Docker build" \
            "Repo: ${{ github.repository }}" \
            "Branch: ${{ github.ref_name }}" \
            "Commit: ${{ github.sha }}" \
            "Author: ${{ github.actor }}" \
            "Reason: ${REASON}" \
            "Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"

  # ── Only runs if `test` succeeded (needs: test). If test fails, this job
  # never starts — no image is built, nothing is pushed, Azure's App Service
  # keeps running whatever container is already live. ────────────────────────
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy container to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.docker_build.outcome }}" != "success" ]; then
            REASON="Docker image build/push to GHCR failed - check the Dockerfile and registry auth."
          elif [ "${{ steps.deploy.outcome }}" != "success" ]; then
            REASON="Azure deploy step failed - check the publish profile/secret and App Service container settings."
          else
            REASON="Unknown step failed."
          fi

          TEXT=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            "Backend Deploy Failed (tests passed, deploy stage broke)" \
            "Repo: ${{ github.repository }}" \
            "Branch: ${{ github.ref_name }}" \
            "Commit: ${{ github.sha }}" \
            "Author: ${{ github.actor }}" \
            "Reason: ${REASON}" \
            "Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"

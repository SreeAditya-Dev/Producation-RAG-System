version: "3.9"

# Deploy to your server:
#   scp backend/docker-compose.qdrant.yml myserver:~/qdrant/
#   ssh myserver "cd ~/qdrant && docker compose -f docker-compose.qdrant.yml up -d"
#
# Qdrant REST API → http://<server-ip>:6333
# Set QDRANT_HOST=<server-ip> in your backend .env

services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API + web UI
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage:z
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
